<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Banking Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Inter Font and Base Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* Light Slate background */
        }
        .icon {
            display: inline-block;
            vertical-align: middle;
        }
        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Login & Registration Page -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-2xl">
            <div class="text-center mb-6">
                <i data-lucide="landmark" class="w-12 h-12 text-indigo-600 mx-auto mb-3"></i>
                <h2 class="text-3xl font-extrabold text-gray-900">Welcome to Your Bank</h2>
                <p class="text-sm text-gray-500 mt-2">Sign in or create a new account to begin.</p>
            </div>
             <p id="login-error-message" class="text-sm text-center text-red-600 font-medium hidden mb-4"></p>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">User ID (Email)</label>
                    <input type="text" name="username" required placeholder="user@bank.com" value="user@bank.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" name="password" required value="password123" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 font-semibold text-white rounded-lg shadow-md bg-indigo-600 hover:bg-indigo-700 flex items-center justify-center">
                    <i data-lucide="log-in" class="w-5 h-5 mr-2 icon"></i> Log In
                </button>
            </form>
            <div class="relative flex justify-center items-center my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
                <div class="relative bg-white px-3 text-sm text-gray-500">New Here?</div>
            </div>
            <button id="show-create-account-modal" class="w-full py-3 font-semibold text-gray-700 rounded-lg border border-gray-300 shadow-sm bg-gray-50 hover:bg-gray-100 flex items-center justify-center">
                <i data-lucide="user-plus" class="w-5 h-5 mr-2 icon"></i> Create New Account
            </button>
        </div>
    </div>

    <!-- New Account Creation Modal -->
    <div id="create-account-modal" class="fixed inset-0 z-50 items-center justify-center modal-backdrop hidden">
        <div class="w-full max-w-2xl p-8 bg-white rounded-xl shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Create Your New Bank Account</h2>
             <p id="create-error-message" class="text-sm text-center text-red-600 font-medium hidden mb-4"></p>
            <form id="create-account-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Full Name</label>
                        <input type="text" name="fullName" required placeholder="John Doe" class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Age</label>
                        <input type="number" name="age" required min="18" placeholder="18" class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                    </div>
                </div>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">User ID (Email)</label>
                        <input type="email" name="username" required placeholder="john.doe@example.com" class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Create Password</label>
                        <input type="password" name="password" required placeholder="Min. 8 characters" class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Gender</label>
                        <select name="gender" required class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Date of Birth</label>
                        <input type="date" name="dob" required class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium">NID Number (National ID)</label>
                    <input type="text" name="nid" required placeholder="1234567890" class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                </div>
                <div class="flex justify-end space-x-4 pt-4">
                    <button type="button" class="modal-cancel-button px-5 py-2 font-semibold text-gray-700 rounded-lg border hover:bg-gray-100">Cancel</button>
                    <button type="submit" class="px-5 py-2 font-semibold text-white rounded-lg shadow-md bg-indigo-600 hover:bg-indigo-700">Create Account</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Action Modals (Deposit, Withdraw, Payment) -->
    <div id="action-modal" class="fixed inset-0 z-50 items-center justify-center modal-backdrop hidden">
         <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-2xl">
            <h2 id="action-modal-title" class="text-2xl font-bold text-gray-800 mb-6">Perform Transaction</h2>
            <form id="action-form" class="space-y-4">
                <div id="description-field-container" class="hidden">
                    <label class="block text-sm font-medium">Recipient / Description</label>
                    <input type="text" id="action-description" placeholder="e.g., Utility Bill, John Doe" class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium">Amount</label>
                    <input type="number" id="action-amount" required min="0.01" step="0.01" placeholder="0.00" class="mt-1 block w-full rounded-md p-2 border border-gray-300">
                </div>
                <p id="action-error-message" class="text-sm text-red-600 font-medium hidden"></p>
                <div class="flex justify-end space-x-4 pt-4">
                    <button type="button" class="modal-cancel-button px-5 py-2 font-semibold text-gray-700 rounded-lg border hover:bg-gray-100">Cancel</button>
                    <button type="submit" id="action-submit-button" class="px-5 py-2 font-semibold text-white rounded-lg shadow-md bg-indigo-600 hover:bg-indigo-700">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Customer Dashboard -->
    <main id="dashboard-container" class="hidden">
        <header class="bg-white shadow-md p-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Your Dashboard</h1>
                <p class="text-sm text-gray-600">Account Number: <span id="account-number" class="font-semibold"></span></p>
            </div>
            <button id="logout-button" class="px-4 py-2 font-semibold text-white rounded-lg shadow-md bg-red-600 hover:bg-red-700 flex items-center">
                <i data-lucide="log-out" class="w-4 h-4 mr-2 icon"></i> Log Out
            </button>
        </header>

        <div class="p-6 space-y-6">
            <div class="bg-indigo-600 text-white p-8 rounded-xl shadow-lg">
                <h2 class="text-lg font-light text-indigo-200">Available Balance</h2>
                <p id="account-balance" class="text-5xl font-extrabold mt-2"></p>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button data-action="deposit" class="action-button flex items-center justify-center p-4 bg-white rounded-lg shadow-sm border hover:bg-gray-50">
                    <i data-lucide="arrow-down-left" class="w-6 h-6 text-green-500 mr-3"></i><span class="font-semibold">Deposit</span>
                </button>
                <button data-action="withdraw" class="action-button flex items-center justify-center p-4 bg-white rounded-lg shadow-sm border hover:bg-gray-50">
                    <i data-lucide="dollar-sign" class="w-6 h-6 text-indigo-500 mr-3"></i><span class="font-semibold">Withdraw</span>
                </button>
                <button data-action="payment" class="action-button flex items-center justify-center p-4 bg-white rounded-lg shadow-sm border hover:bg-gray-50">
                    <i data-lucide="send" class="w-6 h-6 text-blue-500 mr-3"></i><span class="font-semibold">Send Money</span>
                </button>
                 <button data-action="payment" class="action-button flex items-center justify-center p-4 bg-white rounded-lg shadow-sm border hover:bg-gray-50">
                    <i data-lucide="credit-card" class="w-6 h-6 text-red-500 mr-3"></i><span class="font-semibold">Make Payment</span>
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-lg border overflow-hidden">
                <div class="p-4 border-b">
                    <h3 class="text-xl font-bold text-gray-800">Transaction History</h3>
                </div>
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-3 text-left text-xs font-bold text-gray-600 uppercase">Date</th>
                            <th class="p-3 text-left text-xs font-bold text-gray-600 uppercase">Description</th>
                            <th class="p-3 text-right text-xs font-bold text-gray-600 uppercase">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-history" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const authContainer = document.getElementById('auth-container');
            const dashboardContainer = document.getElementById('dashboard-container');
            const createAccountModal = document.getElementById('create-account-modal');
            const actionModal = document.getElementById('action-modal');
            const loginErrorMessage = document.getElementById('login-error-message');
            const createErrorMessage = document.getElementById('create-error-message');
            
            // --- STATE MANAGEMENT ---
            let currentUser = null;
            let currentAction = null;

            // --- SIMULATED USER DATABASE ---
            let userDatabase = [
                {
                    username: 'user@bank.com',
                    password: 'password123',
                    accountNumber: '100-856-4732',
                    balance: 5430.25,
                    transactions: [
                        { date: '2024-11-14', description: 'Online Purchase - Amazon', amount: -75.50 },
                        { date: '2024-11-12', description: 'Salary Deposit - Acme Corp', amount: 2500.00 },
                        { date: '2024-11-11', description: 'Utility Bill Payment', amount: -120.00 },
                    ]
                }
            ];
            
            // --- UI UPDATE FUNCTIONS ---
            const rerenderDashboard = () => {
                if (!currentUser) return;
                document.getElementById('account-number').textContent = currentUser.accountNumber;
                document.getElementById('account-balance').textContent = `$${currentUser.balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                
                const transactionHistoryEl = document.getElementById('transaction-history');
                transactionHistoryEl.innerHTML = '';
                
                // Sort transactions by date descending before rendering
                currentUser.transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

                currentUser.transactions.forEach(tx => {
                    const isCredit = tx.amount > 0;
                    const row = `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 text-sm text-gray-600">${tx.date}</td>
                            <td class="p-3 text-sm text-gray-800">${tx.description}</td>
                            <td class="p-3 text-sm text-right font-semibold ${isCredit ? 'text-green-600' : 'text-red-600'}">
                                ${isCredit ? '+' : ''}$${Math.abs(tx.amount).toFixed(2)}
                            </td>
                        </tr>`;
                    transactionHistoryEl.insertAdjacentHTML('beforeend', row);
                });
            };

            // --- CORE LOGIC ---
            const addTransaction = (description, transactionAmount) => {
                // Insufficient funds check for debit transactions
                if (transactionAmount < 0 && Math.abs(transactionAmount) > currentUser.balance) {
                    const errorMessageEl = document.getElementById('action-error-message');
                    errorMessageEl.textContent = 'Insufficient funds for this transaction.';
                    errorMessageEl.classList.remove('hidden');
                    return; // Stop the transaction
                }

                // Update balance
                currentUser.balance += transactionAmount;

                // Create and add new transaction record
                const newTransaction = {
                    date: new Date().toISOString().split('T')[0],
                    description: description,
                    amount: transactionAmount
                };
                currentUser.transactions.unshift(newTransaction);

                // Update UI and close modal
                rerenderDashboard();
                closeAllModals();
            };
            
            const handleLogin = (e) => {
                e.preventDefault();
                const username = e.target.username.value;
                const password = e.target.password.value;

                const foundUser = userDatabase.find(user => user.username === username);

                if (foundUser && foundUser.password === password) {
                    loginErrorMessage.classList.add('hidden');
                    currentUser = JSON.parse(JSON.stringify(foundUser));
                    authContainer.classList.add('hidden');
                    dashboardContainer.classList.remove('hidden');
                    rerenderDashboard();
                    lucide.createIcons();
                } else {
                    loginErrorMessage.textContent = 'Invalid User ID or password.';
                    loginErrorMessage.classList.remove('hidden');
                }
            };
            
            const handleCreateAccount = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newUsername = formData.get('username');
                const newPassword = formData.get('password');

                const userExists = userDatabase.some(user => user.username === newUsername);
                if (userExists) {
                    createErrorMessage.textContent = 'This User ID is already taken. Please choose another.';
                    createErrorMessage.classList.remove('hidden');
                    return;
                }
                 if (newPassword.length < 8) {
                    createErrorMessage.textContent = 'Password must be at least 8 characters long.';
                    createErrorMessage.classList.remove('hidden');
                    return;
                }
                createErrorMessage.classList.add('hidden');

                const newUser = {
                    username: newUsername,
                    password: newPassword,
                    accountNumber: `200-${Math.floor(100 + Math.random() * 900)}-${Math.floor(1000 + Math.random() * 9000)}`,
                    balance: 100.00,
                    transactions: [{ date: new Date().toISOString().split('T')[0], description: 'Welcome Bonus', amount: 100.00 }]
                };
                userDatabase.push(newUser);
                currentUser = newUser;
                
                alert('Welcome! Your new account has been created and you are now logged in.');
                closeAllModals();
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                rerenderDashboard();
                lucide.createIcons();
            };

            const handleLogout = () => {
                currentUser = null;
                dashboardContainer.classList.add('hidden');
                authContainer.classList.remove('hidden');
            };
            
            // --- MODAL HANDLING ---
            const openActionModal = (action) => {
                currentAction = action;
                const titleEl = document.getElementById('action-modal-title');
                const descriptionContainer = document.getElementById('description-field-container');
                document.getElementById('action-form').reset();
                document.getElementById('action-error-message').classList.add('hidden');

                descriptionContainer.classList.add('hidden');

                if (action === 'deposit') titleEl.textContent = 'Deposit Funds';
                else if (action === 'withdraw') titleEl.textContent = 'Withdraw Cash';
                else if (action === 'payment') {
                    titleEl.textContent = 'Make a Payment / Send Money';
                    descriptionContainer.classList.remove('hidden');
                }
                
                actionModal.style.display = 'flex';
            };

            // **FIXED LOGIC IS HERE**
            const handleActionSubmit = (e) => {
                e.preventDefault();
                const userInputAmount = parseFloat(document.getElementById('action-amount').value);
                const errorMessageEl = document.getElementById('action-error-message');

                // 1. Validate the user's input first
                if (isNaN(userInputAmount) || userInputAmount <= 0) {
                    errorMessageEl.textContent = 'Please enter a valid, positive amount.';
                    errorMessageEl.classList.remove('hidden');
                    return;
                }
                errorMessageEl.classList.add('hidden');

                // 2. Process the transaction based on the action type
                switch (currentAction) {
                    case 'deposit': 
                        addTransaction('Customer Deposit', userInputAmount); 
                        break;
                    case 'withdraw': 
                        addTransaction('ATM Withdrawal', -userInputAmount); 
                        break;
                    case 'payment':
                        const description = document.getElementById('action-description').value || 'Bank Transfer';
                        addTransaction(description, -userInputAmount);
                        break;
                }
            };

            const closeAllModals = () => {
                createAccountModal.style.display = 'none';
                actionModal.style.display = 'none';
            };

            // --- EVENT LISTENERS ---
            document.getElementById('login-form').addEventListener('submit', handleLogin);
            document.getElementById('create-account-form').addEventListener('submit', handleCreateAccount);
            document.getElementById('action-form').addEventListener('submit', handleActionSubmit);
            document.getElementById('logout-button').addEventListener('click', handleLogout);
            document.getElementById('show-create-account-modal').addEventListener('click', () => { createAccountModal.style.display = 'flex'; });
            document.querySelectorAll('.modal-cancel-button').forEach(btn => btn.addEventListener('click', closeAllModals));
            document.querySelectorAll('.action-button').forEach(btn => btn.addEventListener('click', () => openActionModal(btn.dataset.action)));
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
