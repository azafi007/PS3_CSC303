<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Analyst KPI Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN for Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Inter Font and Base Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .icon { display: inline-block; vertical-align: middle; }
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }
        .animate-bounce-slow { animation: bounce-slow 4s infinite; }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar -->
    <nav id="sidebar" class="w-64 bg-gray-900 text-white flex-col shadow-xl hidden">
        <div class="p-6 text-2xl font-extrabold border-b border-gray-700">
            <span class="text-green-400">FinMan</span> Pro
        </div>
        <div class="flex flex-col flex-grow p-4 space-y-2" id="nav-container">
            <!-- Navigation items injected here -->
        </div>
        <div class="p-4 border-t border-gray-700">
            <div class="text-sm font-light">Status: <span class="font-medium text-green-400">Connected</span></div>
            <button id="logout-button" class="w-full mt-3 px-4 py-2 font-semibold text-white rounded-lg shadow-md bg-red-600 hover:bg-red-700 flex items-center justify-center">
                <i data-lucide="log-out" class="w-4 h-4 mr-2 icon"></i> Log Out
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-auto">
        <header class="sticky top-0 bg-white shadow-md z-10 p-4 flex justify-between items-center hidden" id="main-header">
            <h1 id="page-title" class="text-2xl font-bold text-gray-800">Dashboard</h1>
            <div id="header-actions"><!-- Page-specific actions injected here --></div>
        </header>
        <div id="content-area" class="hidden"><!-- Page content injected here --></div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop">
        <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-2xl">
            <div class="text-center mb-6">
                <i data-lucide="lock" class="w-10 h-10 text-indigo-600 mx-auto mb-2 animate-bounce-slow icon"></i>
                <h2 class="text-3xl font-extrabold text-gray-900">Sign In to FinMan Pro</h2>
                <p class="text-sm text-gray-500 mt-2">Analyst Portal</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" required value="analyst@finman.pro" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" required value="SecurePass123" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border">
                </div>
                <button type="submit" class="w-full py-3 font-semibold text-white rounded-lg shadow-md bg-indigo-600 hover:bg-indigo-700 flex items-center justify-center">
                    <i data-lucide="log-in" class="w-5 h-5 mr-2 icon"></i> Log In
                </button>
            </form>
        </div>
    </div>

    <!-- Audit Report Summary Modal -->
    <div id="summary-modal" class="fixed inset-0 z-50 items-center justify-center modal-backdrop hidden">
        <div class="w-full max-w-2xl p-8 bg-white rounded-xl shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="summary-modal-title" class="text-2xl font-bold text-gray-800">Audit Report Summary</h2>
                <button class="modal-cancel-button text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div id="summary-modal-content" class="text-gray-700 space-y-4">
                <!-- Summary content injected here -->
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentPage = 'Dashboard';
            let chartInstance = null;
            let selectedYear = "2024";

            // --- SIMULATED DATABASE ---
            const db = {
                companies: [ { id: 1, name: 'Innovate Corp', sector: 'Technology' }, { id: 2, name: 'HealthFirst Pharma', sector: 'Healthcare' }, { id: 3, name: 'Quantum Financials', sector: 'Finance' }, { id: 4, name: 'Eco Power', sector: 'Energy' } ],
                investors: [ { id: 1, name: 'Alice Johnson', type: 'Individual' }, { id: 2, name: 'Bob Williams', type: 'Individual' }, { id: 3, name: 'Venture Capital Inc.', type: 'Institutional' } ],
                institutions: [ { id: 1, name: 'Global Invest Bank', type: 'Investment Bank' }, { id: 2, name: 'Secure Hedge Fund', type: 'Hedge Fund' } ],
                stocks: [ { id: 1, company_id: 1, symbol: 'INVT' }, { id: 2, company_id: 2, symbol: 'HLTH' }, { id: 3, company_id: 3, symbol: 'QFIN' }, { id: 4, company_id: 4, symbol: 'EPWR' } ],
                stock_transactions: [ { date: '2024-11-15', investor_id: 1, company_id: 1, stock_id: 1, type: 'Buy', shares: 100, price_per_share: 150.50 }, { date: '2024-11-14', investor_id: 2, company_id: 2, stock_id: 2, type: 'Sell', shares: 50, price_per_share: 281.00 } ],
                trades: [ { id: 101, buyer_institution_id: 1, seller_institution_id: 2, stock_id: 1, amount: 753750, date: '2024-11-15' }, { id: 102, buyer_institution_id: 2, seller_institution_id: 1, stock_id: 2, amount: 1402500, date: '2024-11-14' } ],
                audit_reports: [ { id: 201, company_id: 1, institution_id: 1, date: '2024-10-20', auditor: 'Deloitte', summary: 'Financial statements are accurate. Minor issues found in internal controls.' } ],
                price_history: {
                    'INVT': { open: 149.50, close: 150.75, high: 152.00, low: 148.75, volume: '2.5M' },
                    'HLTH': { open: 281.00, close: 280.50, high: 281.00, low: 278.50, volume: '1.1M' },
                    'QFIN': { open: 88.10, close: 88.20, high: 89.50, low: 87.90, volume: '3.2M' },
                    'EPWR': { open: 45.00, close: 47.50, high: 48.00, low: 44.90, volume: '4.1M' }
                },
                predictions: [ { stock_symbol: 'INVT', predicted_price: 155.00, confidence: '88%', model: 'LSTM' }, { stock_symbol: 'HLTH', predicted_price: 275.00, confidence: '92%', model: 'Random Forest' } ],
                market_analysis: {
                    sector_performance: [ { sector: 'Energy', change: '+5.2%' }, { sector: 'Technology', change: '+3.1%' }, { sector: 'Healthcare', change: '+1.5%' }, { sector: 'Finance', change: '-0.8%' } ],
                    top_movers: [ { symbol: 'EPWR', change: '+5.56%', name: 'Eco Power' }, { symbol: 'INVT', change: '+0.84%', name: 'Innovate Corp' }, { symbol: 'HLTH', change: '-0.18%', name: 'HealthFirst Pharma' } ],
                    market_news: [ 'Federal Reserve hints at holding interest rates steady.', 'Innovate Corp (INVT) announces new AI chip, stock rises.', 'Global supply chain pressures show signs of easing.' ]
                }
            };
            
            // Data for yearly reports
            const yearlyData = {
                "2024": {
                    marketCap: 4500000000, tradeVolume: 120000000, sentiment: 'Positive', sentimentColor: 'text-green-600', chartData: { labels: ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ label: 'Market Index', data: [4400, 4550, 4500, 4600], tension: 0.1, borderColor: '#3b82f6' }] }
                },
                "2023": {
                    marketCap: 4100000000, tradeVolume: 105000000, sentiment: 'Neutral', sentimentColor: 'text-yellow-600', chartData: { labels: ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ label: 'Market Index', data: [4000, 4150, 4100, 4200], tension: 0.1, borderColor: '#10b981' }] }
                }
            };

            // --- DOM Elements & Event Listeners ---
            const loginModal = document.getElementById('login-modal');
            const sidebar = document.getElementById('sidebar');
            const mainHeader = document.getElementById('main-header');
            const contentArea = document.getElementById('content-area');

            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                loginModal.classList.add('hidden');
                sidebar.style.display = 'flex';
                mainHeader.classList.remove('hidden');
                contentArea.classList.remove('hidden');
                renderPage(currentPage);
            });

            document.getElementById('logout-button').addEventListener('click', () => {
                sidebar.style.display = 'none';
                mainHeader.classList.add('hidden');
                contentArea.classList.add('hidden');
                loginModal.classList.remove('hidden');
            });
            
            document.querySelectorAll('.modal-cancel-button').forEach(btn => btn.addEventListener('click', () => document.getElementById('summary-modal').style.display = 'none'));


            // --- Navigation ---
            window.navigateTo = (pageName) => {
                currentPage = pageName;
                renderPage(pageName);
            };

            const setupNavigation = () => {
                const navContainer = document.getElementById('nav-container');
                navContainer.innerHTML = '';
                const pages = [
                    { name: 'Dashboard', icon: 'layout-dashboard' },
                    { name: 'Market Analysis', icon: 'trending-up' },
                    { name: 'Institutional Trades', icon: 'building-2' },
                    { name: 'Investor Transactions', icon: 'users' },
                    { name: 'Audit Reports', icon: 'shield-check' },
                    { name: 'Price History', icon: 'history' },
                    { name: 'AI Predictions', icon: 'brain-circuit' }
                ];

                pages.forEach(page => {
                    const button = document.createElement('button');
                    const isActive = page.name === currentPage;
                    button.className = `flex items-center space-x-3 p-3 rounded-lg ${isActive ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'}`;
                    button.onclick = () => navigateTo(page.name);
                    button.innerHTML = `<i data-lucide="${page.icon}" class="w-5 h-5 mr-2 icon"></i><span>${page.name}</span>`;
                    navContainer.appendChild(button);
                });
                lucide.createIcons();
            };
            
            // --- Page Router ---
            const renderPage = (pageName) => {
                document.getElementById('page-title').textContent = pageName;
                setupNavigation();
                const headerActions = document.getElementById('header-actions');
                headerActions.innerHTML = '';

                switch (pageName) {
                    case 'Dashboard':
                        headerActions.innerHTML = `<select id="year-filter" class="rounded-md bg-gray-100 border-gray-300 py-2 text-sm"><option value="2024">2024 Report</option><option value="2023">2023 Report</option></select>`;
                        renderDashboard();
                        document.getElementById('year-filter').value = selectedYear;
                        document.getElementById('year-filter').addEventListener('change', (e) => {
                            selectedYear = e.target.value;
                            renderDashboard();
                        });
                        break;
                    case 'Market Analysis': renderMarketAnalysis(); break;
                    case 'Institutional Trades': renderInstitutionalTrades(db.trades); break;
                    case 'Investor Transactions': renderInvestorTransactions(db.stock_transactions); break;
                    case 'Audit Reports': renderAuditReports(db.audit_reports); break;
                    case 'Price History': renderPriceHistory(); break;
                    case 'AI Predictions': renderAIPredictions(db.predictions); break;
                    default: contentArea.innerHTML = `<div class="p-6">404 Not Found</div>`;
                }
                lucide.createIcons();
            };

            // --- PAGE RENDERING FUNCTIONS ---
            
            const renderDashboard = () => {
                const data = yearlyData[selectedYear];
                let stockTickerHTML = db.stocks.map(stock => {
                    const history = db.price_history[stock.symbol];
                    if(!history) return '';
                    const change = history.close - history.open;
                    const changePercent = (change / history.open) * 100;
                    const isPositive = change >= 0;
                    return `
                        <div class="bg-white p-3 rounded-lg shadow-sm border flex items-center justify-between">
                            <div>
                                <p class="font-bold text-gray-800">${stock.symbol}</p>
                                <p class="text-lg font-extrabold text-gray-900">$${history.close.toFixed(2)}</p>
                            </div>
                            <div class="text-right ${isPositive ? 'text-green-600' : 'text-red-600'}">
                                <i data-lucide="${isPositive ? 'trending-up' : 'trending-down'}" class="w-5 h-5 icon"></i>
                                <p class="font-semibold text-sm">${changePercent.toFixed(2)}%</p>
                            </div>
                        </div>
                    `;
                }).join('');

                contentArea.innerHTML = `
                    <div class="p-6 space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">${stockTickerHTML}</div>
                        <h1 class="text-3xl font-extrabold text-gray-900 mt-4">${selectedYear} Market Overview</h1>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-white p-6 rounded-lg shadow-sm border"><h3 class="text-sm font-semibold text-gray-500">Total Market Cap</h3><p class="text-3xl font-extrabold text-gray-900 mt-2">$${(data.marketCap/1000000000).toFixed(2)}B</p></div>
                            <div class="bg-white p-6 rounded-lg shadow-sm border"><h3 class="text-sm font-semibold text-gray-500">Total Trade Volume</h3><p class="text-3xl font-extrabold text-gray-900 mt-2">$${(data.tradeVolume/1000000).toFixed(2)}M</p></div>
                            <div class="bg-white p-6 rounded-lg shadow-sm border"><h3 class="text-sm font-semibold text-gray-500">Market Sentiment</h3><p class="text-3xl font-extrabold ${data.sentimentColor} mt-2">${data.sentiment}</p></div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-lg border">
                            <h2 class="text-xl font-bold text-gray-800">${selectedYear} Market Index Performance</h2>
                            <div style="height: 300px;"><canvas id="main-chart"></canvas></div>
                        </div>
                    </div>`;
                
                lucide.createIcons();
                const ctx = document.getElementById('main-chart').getContext('2d');
                if(chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, { type: 'line', data: data.chartData, options: { responsive: true, maintainAspectRatio: false } });
            };

            const renderMarketAnalysis = () => {
                const analysis = db.market_analysis;
                let sectorHTML = analysis.sector_performance.map(s => `<li class="flex justify-between py-2"><span class="font-medium text-gray-700">${s.sector}</span><span class="font-bold ${s.change.startsWith('+') ? 'text-green-600' : 'text-red-600'}">${s.change}</span></li>`).join('');
                let moversHTML = analysis.top_movers.map(m => `<li class="flex justify-between py-2"><span class="font-medium text-gray-700">${m.name} (${m.symbol})</span><span class="font-bold ${m.change.startsWith('+') ? 'text-green-600' : 'text-red-600'}">${m.change}</span></li>`).join('');
                let newsHTML = analysis.market_news.map(n => `<li class="py-2 text-gray-700">${n}</li>`).join('');

                contentArea.innerHTML = `
                    <div class="p-6 space-y-6">
                         <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg border">
                                <h2 class="text-xl font-bold text-gray-800 mb-4">Key Market News</h2>
                                <ul class="divide-y">${newsHTML}</ul>
                            </div>
                            <div class="space-y-6">
                                <div class="bg-white p-6 rounded-xl shadow-lg border">
                                    <h2 class="text-xl font-bold text-gray-800 mb-4">Sector Performance (YTD)</h2>
                                    <ul class="divide-y">${sectorHTML}</ul>
                                </div>
                                <div class="bg-white p-6 rounded-xl shadow-lg border">
                                    <h2 class="text-xl font-bold text-gray-800 mb-4">Top Movers (24h)</h2>
                                    <ul class="divide-y">${moversHTML}</ul>
                                </div>
                            </div>
                        </div>
                    </div>`;
            };

            const renderInstitutionalTrades = (trades) => {
                 let tableRows = trades.map(t => {
                    const stock = db.stocks.find(s => s.id === t.stock_id);
                    const buyer = db.institutions.find(i => i.id === t.buyer_institution_id);
                    const seller = db.institutions.find(i => i.id === t.seller_institution_id);
                    return `<tr class="hover:bg-gray-50"><td class="p-3">${t.date}</td><td class="p-3 font-medium">${stock.symbol}</td><td class="p-3">${buyer.name}</td><td class="p-3">${seller.name}</td><td class="p-3 font-semibold text-right">$${t.amount.toLocaleString()}</td></tr>`;
                }).join('');
                contentArea.innerHTML = `<div class="p-6"><div class="bg-white rounded-xl shadow-lg border overflow-hidden"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr>${['Date', 'Asset', 'Buyer', 'Seller', 'Amount'].map(h => `<th class="p-3 text-left font-bold uppercase">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${tableRows}</tbody></table></div></div>`;
            };

             const renderInvestorTransactions = (transactions) => {
                let tableRows = transactions.map(t => {
                    const stock = db.stocks.find(s => s.id === t.stock_id);
                    const investor = db.investors.find(i => i.id === t.investor_id);
                    const company = db.companies.find(c => c.id === t.company_id);
                    const totalValue = t.shares * t.price_per_share;
                    return `<tr class="hover:bg-gray-50">
                        <td class="p-3">${t.date}</td><td class="p-3 font-medium">${investor.name}</td>
                        <td class="p-3"><span class="px-2 py-1 text-xs font-semibold rounded-full ${t.type === 'Buy' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${t.type}</span></td>
                        <td class="p-3">${company.name} (${stock.symbol})</td><td class="p-3 text-right">${t.shares.toLocaleString()}</td>
                        <td class="p-3 text-right">$${t.price_per_share.toFixed(2)}</td><td class="p-3 font-semibold text-right">$${totalValue.toLocaleString()}</td></tr>`;
                }).join('');
                contentArea.innerHTML = `<div class="p-6"><div class="bg-white rounded-xl shadow-lg border overflow-hidden"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr>${['Date', 'Investor', 'Type', 'Company (Stock)', 'Shares', 'Price/Share', 'Total Value'].map(h => `<th class="p-3 text-left font-bold uppercase">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${tableRows}</tbody></table></div></div>`;
            };
            
            const renderAuditReports = (reports) => {
                let tableRows = reports.map(r => {
                    const company = db.companies.find(c => c.id === r.company_id);
                    return `<tr class="hover:bg-gray-50"><td class="p-3 font-medium">${company.name}</td><td class="p-3">${r.date}</td><td class="p-3">${r.auditor}</td><td class="p-3"><button onclick="viewSummary(${r.id})" class="font-semibold text-indigo-600 hover:underline">View Summary</button></td></tr>`;
                }).join('');
                contentArea.innerHTML = `<div class="p-6"><div class="bg-white rounded-xl shadow-lg border overflow-hidden"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr>${['Company', 'Date', 'Auditor', 'Actions'].map(h => `<th class="p-3 text-left font-bold uppercase">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${tableRows}</tbody></table></div></div>`;
            };
            
            const renderPriceHistory = () => {
                let tableRows = db.stocks.map(stock => {
                    const company = db.companies.find(c => c.id === stock.company_id);
                    const history = db.price_history[stock.symbol];
                    if (!history) return '';
                    return `<tr class="hover:bg-gray-50"><td class="p-3 font-medium">${stock.symbol}</td><td class="p-3">${company.name}</td><td class="p-3 text-right">$${history.open.toFixed(2)}</td><td class="p-3 text-right">$${history.high.toFixed(2)}</td><td class="p-3 text-right">$${history.low.toFixed(2)}</td><td class="p-3 font-semibold text-right">$${history.close.toFixed(2)}</td><td class="p-3 text-right">${history.volume}</td></tr>`;
                }).join('');
                contentArea.innerHTML = `<div class="p-6"><div class="bg-white rounded-xl shadow-lg border overflow-hidden"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr>${['Symbol', 'Company', 'Open', 'High', 'Low', 'Close', 'Volume'].map(h => `<th class="p-3 text-left font-bold uppercase">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${tableRows}</tbody></table></div></div>`;
            };

            const renderAIPredictions = (predictions) => {
                let tableRows = predictions.map(p => {
                    const history = db.price_history[p.stock_symbol];
                    return `<tr class="hover:bg-gray-50"><td class="p-3 font-medium">${p.stock_symbol}</td><td class="p-3 text-right">$${history.close.toFixed(2)}</td><td class="p-3 font-bold text-indigo-600 text-right">$${p.predicted_price.toFixed(2)}</td><td class="p-3 text-right">${p.confidence}</td><td class="p-3">${p.model}</td></tr>`;
                }).join('');
                contentArea.innerHTML = `<div class="p-6"><div class="bg-white rounded-xl shadow-lg border overflow-hidden"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr>${['Stock', 'Current Price', 'Predicted Price (30d)', 'Confidence', 'Model Used'].map(h => `<th class="p-3 text-left font-bold uppercase">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${tableRows}</tbody></table></div></div>`;
            };

            // --- MODAL FUNCTIONS ---
            window.viewSummary = (reportId) => {
                const report = db.audit_reports.find(r => r.id === reportId);
                document.getElementById('summary-modal-title').textContent = `Report #${report.id} Summary`;
                document.getElementById('summary-modal-content').innerHTML = `<p>${report.summary}</p>`;
                document.getElementById('summary-modal').style.display = 'flex';
            };
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
