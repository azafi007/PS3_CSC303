<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Portal - Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-panel-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-border: rgba(239, 68, 68, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Inter, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-link {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 0.25rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: var(--bg-panel-hover);
            color: var(--text-primary);
        }

        .nav-link.active {
            border-left: 3px solid var(--accent-blue);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Header */
        .header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auditor-info {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
        }

        .info-label {
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

        .info-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Dashboard Grid */
        .dashboard-container {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Metric Cards */
        .metric-cards-row {
            grid-column: span 12;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-subtext {
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .text-green {
            color: var(--accent-green);
        }

        .text-red {
            color: var(--accent-red);
        }

        /* Tables & Forms Containers */
        .section-container {
            grid-column: span 12;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .section-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.02);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--bg-dark);
            color: var(--text-secondary);
            font-weight: 600;
            text-align: left;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            white-space: nowrap;
        }

        td {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr:hover {
            background-color: var(--bg-panel-hover);
        }

        .high-risk-row {
            background-color: var(--danger-bg) !important;
            border-left: 4px solid var(--accent-red);
        }

        .high-risk-row td {
            color: #fecaca;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            grid-column: span 2;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            justify-self: start;
            min-width: 150px;
        }


        .btn-submit:hover {
            background-color: #2563eb;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            transition: all 0.2s;
        }

        .btn-action:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-action.text-red:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">FinAudit Pro</div>
        <nav>
            <a href="auditor_dashboard.html" class="nav-link active">Dashboard</a>
            <a href="fraud_alerts.html" class="nav-link">Fraud Alerts</a>
            <a href="audit_reports.html" class="nav-link">Audit Reports</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="auditor-info">
                <div>
                    <span class="info-label">Current Auditor:</span>
                    <span class="info-value">Robert Brown (Staff ID: 103)</span>
                </div>
                <div>
                    <span class="info-label">Last Review Date:</span>
                    <span class="info-value">2025-12-08</span>
                </div>
            </div>
            <div class="auditor-info">
                <div>
                    <span class="info-label">System Status:</span>
                    <span class="info-value text-green">Online</span>
                </div>
            </div>
        </header>

        <!-- Dashboard Grid -->
        <div class="dashboard-container">

            <!-- Metric Cards -->
            <div class="metric-cards-row">
                <div class="card">
                    <div class="card-title">Total Transactions</div>
                    <div class="card-value">9,001</div>
                    <div class="card-subtext">Processed this quarter</div>
                </div>
                <!-- Highlight: Active Fraud Alerts -->
                <div class="card" style="border-bottom: 2px solid var(--accent-red);">
                    <div class="card-title text-red">Active Fraud Alerts</div>
                    <div class="card-value text-red">1</div>
                    <div class="card-subtext text-red">Requires Immediate Attention</div>
                </div>
                <div class="card">
                    <div class="card-title">Market Volume</div>
                    <div class="card-value">52,000</div>
                    <div class="card-subtext">As of 2025-12-19</div>
                </div>
            </div>


        </div>
    </div>
</body>

</html>
